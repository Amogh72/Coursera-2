<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cars Dealership | Find your dealership</title>
  <link rel="stylesheet" href="/static/bootstrap.min.css">
  <link rel="stylesheet" href="/static/style.css">
  <style>
    body{background:#f5f7fa;color:#14263a}
    .hero{max-width:1050px;margin:3rem auto;padding:0 1rem}
    .hero-card{overflow:hidden;border:0;border-radius:1rem;box-shadow:0 12px 36px rgba(16,36,58,.14)}
    .hero-card img{width:100%;max-height:390px;object-fit:cover}
    .hero-copy{padding:2rem}
    .hero-copy h1{font-weight:750}
    .nav-link{font-size:1.05rem}
  </style>
  <script>
    async function logout() {
      try {
        const response = await fetch("/djangoapp/logout", { method: "GET", credentials: "include" });
        if (!response.ok) throw new Error("Logout failed");
        sessionStorage.removeItem("username");
        sessionStorage.removeItem("firstname");
        sessionStorage.removeItem("lastname");
        window.location.reload();
      } catch (error) {
        alert("Unable to log out right now. Please try again.");
      }
    }
    function checkSession() {
      const container = document.getElementById("loginlogout");
      container.replaceChildren();
      const username = sessionStorage.getItem("username");
      if (username) {
        const label = document.createElement("span");
        label.className = "navbar-text me-3";
        label.textContent = username;
        const link = document.createElement("a");
        link.className = "nav-link d-inline";
        link.href = "/djangoapp/logout";
        link.textContent = "Logout";
        link.addEventListener("click", (event) => { event.preventDefault(); logout(); });
        container.append(label, link);
      } else {
        const login = document.createElement("a");
        login.className = "nav-link d-inline";
        login.href = "{{ frontend_url }}/login";
        login.textContent = "Login";
        const register = document.createElement("a");
        register.className = "nav-link d-inline ms-3";
        register.href = "{{ frontend_url }}/register";
        register.textContent = "Register";
        container.append(login, register);
      }
    }
  </script>
</head>
<body onload="checkSession()">
  <nav class="navbar navbar-expand-lg navbar-light" style="background-color:darkturquoise;min-height:1in">
    <div class="container-fluid">
      <a class="navbar-brand" href="/"><strong>Cars Dealership</strong></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarText" aria-controls="navbarText" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarText">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link active" href="/">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="/about/">About Us</a></li>
          <li class="nav-item"><a class="nav-link" href="/contact/">Contact Us</a></li>
        </ul>
        <div class="d-flex align-items-center" id="loginlogout"></div>
      </div>
    </div>
  </nav>
  <main class="hero">
    <section class="card hero-card">
      <img src="/static/car_dealership.jpg" alt="Cars displayed at a dealership showroom">
      <div class="hero-copy">
        <p class="text-uppercase text-muted mb-2">Your next drive starts here</p>
        <h1>Find a dealership. Share your experience.</h1>
        <p class="lead">Explore dealership locations across the United States, compare details, and read customer reviews before your next visit.</p>
        <a href="{{ frontend_url }}/dealers" class="btn btn-primary btn-lg mt-2">Browse Dealerships</a>
      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
